version: 2

sources:
  - name: tpcds_raw
    database: TPCDS
    schema: TPCDS_PIPELINE
    description: >
      TPC-DS benchmark dataset loaded from the external stage @EXT_STAGE_TPCDS
      into Snowflake. Files are stored in S3 (s3://tpcdsnicolasstage/tpcds/)
      in three formats: CSV (FF_CSV), JSON (FF_JSON), and Parquet (FF_PARQUET).

    tables:

      # -----------------------------------------------------------------------
      # PARQUET tables
      # -----------------------------------------------------------------------

      - name: call_center
        description: "Call center dimension. Each row represents a point-in-time snapshot of a call center (SCD type 2)."
        external:
          location: "@{{ var('stages')['raw'] }}/tpcds/call_center.parquet"
          file_format: "{{ var('file_formats')['parquet'] }}"
        columns:
          - name: cc_call_center_sk
            description: "Surrogate key."
            data_type: NUMBER
          - name: cc_call_center_id
            description: "Business key."
            data_type: VARCHAR
          - name: cc_rec_start_date
            description: "SCD2 record start date."
            data_type: DATE
          - name: cc_rec_end_date
            description: "SCD2 record end date (NULL = current record)."
            data_type: DATE
          - name: cc_closed_date_sk
            description: "FK to date_dim — date the call center was closed."
            data_type: NUMBER
          - name: cc_open_date_sk
            description: "FK to date_dim — date the call center opened."
            data_type: NUMBER
          - name: cc_name
            data_type: VARCHAR
          - name: cc_class
            data_type: VARCHAR
          - name: cc_employees
            data_type: NUMBER
          - name: cc_sq_ft
            data_type: NUMBER
          - name: cc_hours
            data_type: VARCHAR
          - name: cc_manager
            data_type: VARCHAR
          - name: cc_mkt_id
            data_type: NUMBER
          - name: cc_mkt_class
            data_type: VARCHAR
          - name: cc_mkt_desc
            data_type: VARCHAR
          - name: cc_market_manager
            data_type: VARCHAR
          - name: cc_division
            data_type: NUMBER
          - name: cc_division_name
            data_type: VARCHAR
          - name: cc_company
            data_type: NUMBER
          - name: cc_company_name
            data_type: VARCHAR
          - name: cc_street_number
            data_type: VARCHAR
          - name: cc_street_name
            data_type: VARCHAR
          - name: cc_street_type
            data_type: VARCHAR
          - name: cc_suite_number
            data_type: VARCHAR
          - name: cc_city
            data_type: VARCHAR
          - name: cc_county
            data_type: VARCHAR
          - name: cc_state
            data_type: VARCHAR
          - name: cc_zip
            data_type: VARCHAR
          - name: cc_country
            data_type: VARCHAR
          - name: cc_gmt_offset
            data_type: VARCHAR
          - name: cc_tax_percentage
            data_type: VARCHAR

      - name: catalog_sales
        description: "Catalog sales fact table. Each row is a line item in a catalog order."
        external:
          location: "@{{ var('stages')['raw'] }}/tpcds/catalog_sales.parquet"
          file_format: "{{ var('file_formats')['parquet'] }}"
        columns:
          - name: cs_sold_date_sk
            description: "FK to date_dim."
            data_type: NUMBER
          - name: cs_sold_time_sk
            description: "FK to time_dim."
            data_type: NUMBER
          - name: cs_ship_date_sk
            description: "FK to date_dim."
            data_type: NUMBER
          - name: cs_bill_customer_sk
            description: "FK to customer — billing customer."
            data_type: NUMBER
          - name: cs_bill_cdemo_sk
            data_type: NUMBER
          - name: cs_bill_hdemo_sk
            data_type: NUMBER
          - name: cs_bill_addr_sk
            data_type: NUMBER
          - name: cs_ship_customer_sk
            description: "FK to customer — shipping customer."
            data_type: NUMBER
          - name: cs_ship_cdemo_sk
            data_type: NUMBER
          - name: cs_ship_hdemo_sk
            data_type: NUMBER
          - name: cs_ship_addr_sk
            data_type: NUMBER
          - name: cs_call_center_sk
            description: "FK to call_center."
            data_type: NUMBER
          - name: cs_catalog_page_sk
            description: "FK to catalog_page."
            data_type: NUMBER
          - name: cs_ship_mode_sk
            description: "FK to ship_mode."
            data_type: NUMBER
          - name: cs_warehouse_sk
            description: "FK to warehouse."
            data_type: NUMBER
          - name: cs_item_sk
            description: "FK to item."
            data_type: NUMBER
          - name: cs_promo_sk
            description: "FK to promotion."
            data_type: NUMBER
          - name: cs_order_number
            data_type: NUMBER
          - name: cs_quantity
            data_type: NUMBER
          - name: cs_wholesale_cost
            data_type: VARCHAR
          - name: cs_list_price
            data_type: VARCHAR
          - name: cs_sales_price
            data_type: VARCHAR
          - name: cs_ext_discount_amt
            data_type: VARCHAR
          - name: cs_ext_sales_price
            data_type: VARCHAR
          - name: cs_ext_wholesale_cost
            data_type: VARCHAR
          - name: cs_ext_list_price
            data_type: VARCHAR
          - name: cs_ext_tax
            data_type: VARCHAR
          - name: cs_coupon_amt
            data_type: VARCHAR
          - name: cs_ext_ship_cost
            data_type: VARCHAR
          - name: cs_net_paid
            data_type: VARCHAR
          - name: cs_net_paid_inc_tax
            data_type: VARCHAR
          - name: cs_net_paid_inc_ship
            data_type: VARCHAR
          - name: cs_net_paid_inc_ship_tax
            data_type: VARCHAR
          - name: cs_net_profit
